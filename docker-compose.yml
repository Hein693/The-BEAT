version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      - NODE_ENV=production
      - PORT=8088
    # Optional: mount source code for development (comment out for production)
    # volumes:
    #   - .:/usr/src/app
    #   - /usr/src/app/node_modules
    #   # Prevent overwriting node_modules inside container
    #   - /usr/src/app/node_modules
    restart: unless-stopped
